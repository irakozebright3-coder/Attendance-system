<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">AttendanceFlow logo</title>
  <desc id="desc">A circular gradient attendance mark with an A and a check.</desc>
  <defs>
    <linearGradient id="g" x1="30" y1="20" x2="225" y2="235" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa"/>
      <stop offset=".52" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="r" cx=".32" cy=".2" r=".9">
      <stop stop-color="#fff" stop-opacity=".34"/>
      <stop offset=".18" stop-color="#9f7aea" stop-opacity=".26"/>
      <stop offset="1" stop-color="#090d1b" stop-opacity=".96"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="128" cy="128" r="106" fill="#060914" stroke="url(#g)" stroke-width="7"/>
  <circle cx="128" cy="128" r="88" fill="url(#r)" stroke="#ffffff" stroke-opacity=".12"/>
  <path d="M82 176 112 83c3-10 8-16 16-16s13 6 16 16l30 93h-25l-6-22h-40l-6 22H82Zm29-43h25l-12-39-13 39Z" fill="#f8fafc"/>
  <path d="m101 151 20 20 39-47" fill="none" stroke="url(#g)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="193" cy="62" r="10" fill="#67e8f9" filter="url(#glow)"/>
</svg>