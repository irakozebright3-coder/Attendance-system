  <rect x="16" y="16" width="224" height="224" rx="60" fill="url(#bg)"/>
  <rect x="16" y="16" width="224" height="224" rx="60" fill="url(#shine)"/>
  <rect x="17.5" y="17.5" width="221" height="221" rx="58.5" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="3"/>
  <!-- the letter A: soft shadow, then the white glyph -->
